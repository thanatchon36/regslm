[project]
name = "regslm"
version = "0.0.1"
description = "Small, fully on-premises language models that extract structured obligations from public financial rulebooks."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Thanatchon Chongmankhong" }]
requires-python = ">=3.11"
keywords = ["suptech", "regtech", "small-language-models", "fine-tuning", "grpo", "quantization", "thai-nlp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "polars>=1.0",
    "pyarrow>=15",
    "httpx>=0.27",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "rich>=13",
]

[project.optional-dependencies]
th = ["pythainlp>=5.0"]
pdf = ["pypdf>=4.0"]
train = ["torch", "transformers", "trl", "peft", "bitsandbytes", "datasets", "accelerate"]
serve = ["vllm"]
gguf = ["llama-cpp-python"]
api = ["anthropic"]
docs = ["mkdocs-material"]

[project.scripts]
regslm = "regslm.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regslm"]

[tool.uv]
# vLLM and the training stack pin incompatible torch builds; resolve them separately.
conflicts = [[{ extra = "train" }, { extra = "serve" }]]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Multilingual corpus (Thai digits, legal symbols): ambiguous-unicode rules are noise.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]
"tests/*" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/regslm/schema", "src/regslm/rewards", "src/regslm/corpus/base.py", "src/regslm/eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits live regulator endpoints (deselect with -m 'not network')", "gpu: needs CUDA"]
addopts = "-m 'not network and not gpu'"
